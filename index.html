<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频视觉化生成器 工作台Pro v1</title>
    
    <style>
        :root {
            --bg-dark: #07080c;
            --panel-bg: #12141c;
            --text-main: #f8fafc;
            --accent: #0ea5e9;
            --accent-hover: #38bdf8;
            --border: rgba(255, 255, 255, 0.08);
            --header-bg: rgba(0,0,0,0.4);
            --item-bg: rgba(0,0,0,0.25);
            --input-bg: #0f1219;
            --muted-text: #cbd5e1;
            --stage-bg: radial-gradient(circle at center, #111420 0%, #030406 100%);
        }

        /* 浅色主题变量配置 */
        body.light {
            --bg-dark: #e2e8f0;
            --panel-bg: #ffffff;
            --text-main: #0f172a;
            --border: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(0,0,0,0.05);
            --item-bg: #f8fafc;
            --input-bg: #f1f5f9;
            --muted-text: #475569;
            --stage-bg: radial-gradient(circle at center, #f8fafc 0%, #cbd5e1 100%);
        }

        body { margin: 0; padding: 0; background-color: var(--bg-dark); color: var(--text-main); font-family: "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }

        .sidebar { width: 440px; min-width: 440px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; box-shadow: 10px 0 30px rgba(0,0,0,0.1); transition: background-color 0.3s; }
        
        .title-container { padding: 22px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); }
        h1 { margin: 0; font-size: 1.35rem; background: linear-gradient(-225deg, #00d2ff 0%, #3a7bd5 29%, #ff007f 67%, #00d2ff 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientSweep 4s linear infinite; font-weight: 700; letter-spacing: 0.5px; }
        @keyframes gradientSweep { to { background-position: 200% center; } }
        
        #themeToggle { background: transparent; border: 1px solid var(--border); color: var(--text-main); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        #themeToggle:hover { background: var(--border); }

        .controls-scroll { flex: 1; overflow-y: auto; padding: 18px; }
        .controls-scroll::-webkit-scrollbar { width: 6px; }
        .controls-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }

        details { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; transition: 0.3s; }
        summary { padding: 14px 16px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; justify-content: space-between; background: var(--item-bg); border-radius: 8px; transition: 0.3s; }
        .group-content { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

        .ctrl-row { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-col { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.95rem; color: var(--muted-text); display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .val-display { color: var(--accent); font-family: monospace; font-weight: 600; font-size: 1rem; }
        
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 5px; background: #94a3b8; border-radius: 3px; margin-top: 4px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; transition: 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        
        select, input[type="color"] { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px; border-radius: 6px; outline: none; font-size: 0.95rem; transition: 0.3s; }
        input[type="color"] { padding: 2px; height: 34px; cursor: pointer; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        
        .file-group { display: flex; gap: 10px; align-items: center; }
        .file-btn { flex: 1; background: var(--input-bg); border: 1px dashed var(--muted-text); padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.9rem; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .file-btn:hover { border-color: var(--accent); color: var(--accent); }
        .clear-btn { background: #ef4444; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; display: none; }
        input[type="file"] { display: none; }

        .record-zone { padding: 18px; border-top: 1px solid var(--border); background: var(--header-bg); }
        .btn-record { width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.05rem; letter-spacing: 1px; transition: 0.2s; }
        .btn-record:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-recording { background: linear-gradient(135deg, #e11d48, #be123c) !important; animation: pulse 1s infinite; }

        .main-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; position: relative; background: var(--stage-bg); transition: 0.3s; }
        
        #canvasWrapper { width: 100%; max-width: 1400px; aspect-ratio: 16/9; background: #000; border-radius: 10px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); overflow: hidden; position: relative; border: 1px solid var(--border); }
        canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
        
        .playback-controls { margin-top: 25px; width: 100%; max-width: 1400px; display: flex; align-items: center; gap: 15px; background: var(--header-bg); padding: 15px 25px; border-radius: 10px; border: 1px solid var(--border); }
        .play-btn { background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 50%; color: #fff; cursor: pointer; font-size: 1.3rem; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .play-btn:hover { transform: scale(1.05); background: var(--accent-hover); }
        .progress-bar { flex: 1; display: flex; align-items: center; gap: 15px; font-size: 0.95rem; }
        
        /* 常驻隐藏多媒体标签，解决浏览器挂起解码器的终极方案 */
        #audioPlayer, #bgVideo { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="title-container">
            <h1>音频视觉化生成器 工作台Pro v1</h1>
            <button id="themeToggle" title="切换深浅主题配色">🌓</button>
        </div>
        
        <div class="controls-scroll">
            
            <details open>
                <summary>📂 媒体导入与遮罩</summary>
                <div class="group-content">
                    <div class="file-group">
                        <label class="file-btn" id="audioLabel" for="audioFile">📥 载入音频 (MP3/WAV)</label>
                        <input type="file" id="audioFile" accept="audio/*">
                        <button class="clear-btn" id="clearAudio">✖</button>
                    </div>
                    <div class="file-group">
                        <label class="file-btn" id="bgLabel" for="bgFile">🖼️ 载入视觉背景 (图/视频)</label>
                        <input type="file" id="bgFile" accept="image/*,video/*">
                        <button class="clear-btn" id="clearBg">✖</button>
                    </div>
                    <div class="ctrl-col">
                        <label>背景画面明暗度 <span class="val-display" id="valBgDim">0.60</span></label>
                        <input type="range" id="bgDim" min="0" max="1" step="0.01" value="0.60">
                    </div>
                </div>
            </details>

            <details open>
                <summary>📐 频谱结构与排版布局</summary>
                <div class="group-content">
                    <div class="ctrl-row">
                        <label style="justify-content: flex-start; gap: 10px;"><input type="checkbox" id="showTop" checked> 启用顶部频谱</label>
                        <label style="justify-content: flex-start; gap: 10px;"><input type="checkbox" id="showBot" checked> 启用底部频谱</label>
                    </div>
                    <div class="ctrl-col">
                        <label>排版方向布局</label>
                        <select id="layoutStyle">
                            <option value="symmetric">中心向两端对称 (镜面)</option>
                            <option value="single">单向传统 (左低右高)</option>
                        </select>
                    </div>
                    <div class="ctrl-row">
                        <label>条形渲染风格</label>
                        <select id="barStyle" style="width:140px;">
                            <option value="round">圆角胶囊</option>
                            <option value="butt">直角矩阵</option>
                        </select>
                    </div>
                    <div class="ctrl-col">
                        <label>单边频段总数量 <span class="val-display" id="valBarCount">120</span> 条</label>
                        <input type="range" id="barCount" min="20" max="256" step="1" value="120">
                    </div>
                    <div class="ctrl-col">
                        <label>单根条形厚度 (支持4K重载) <span class="val-display" id="valBarThick">8</span> px</label>
                        <input type="range" id="barThick" min="1" max="100" step="1" value="8">
                    </div>
                    <div class="ctrl-col">
                        <label>条形之间间距 <span class="val-display" id="valBarGap">4</span> px</label>
                        <input type="range" id="barGap" min="0" max="50" step="1" value="4">
                    </div>

                    <hr style="border-top:1px solid var(--border); margin: 5px 0;">
                    <div class="ctrl-col">
                        <label style="color: #38bdf8;">整体频谱静态基准宽度 <span class="val-display" id="valSpectrumWidth">70</span>%</label>
                        <input type="range" id="spectrumWidth" min="10" max="100" step="1" value="70">
                    </div>
                    <div class="ctrl-col">
                        <label style="color: #10b981;">整体频谱动态跳动幅度 <span class="val-display" id="valSpectrumBounce">20</span>%</label>
                        <input type="range" id="spectrumBounce" min="0" max="100" step="1" value="20">
                    </div>

                    <div class="ctrl-col">
                        <label>静音底座保留高度 <span class="val-display" id="valMinH">4.0</span> px</label>
                        <input type="range" id="minHeight" min="0" max="50" step="0.5" value="4.0">
                    </div>
                </div>
            </details>

            <details open>
                <summary>🎨 调色盘与全局辉光</summary>
                <div class="group-content">
                    <div class="ctrl-col">
                        <label>音频条不透明度 (Alpha) <span class="val-display" id="valBarAlpha">1.00</span></label>
                        <input type="range" id="barAlpha" min="0.1" max="1.0" step="0.01" value="1.0">
                    </div>
                    <div class="ctrl-col">
                        <label>色彩驱动引擎</label>
                        <select id="colorMode">
                            <option value="rainbow">彩虹流光 (动态)</option>
                            <option value="gradient">双色渐变 (静态)</option>
                            <option value="single">纯色填充 (静态)</option>
                        </select>
                    </div>
                    <div id="rainbowPanel" class="ctrl-col">
                        <div class="ctrl-col">
                            <label>彩虹流转速度 <span class="val-display" id="valRbSpeed">1.0</span></label>
                            <input type="range" id="rbSpeed" min="0.1" max="5.0" step="0.1" value="1.0">
                        </div>
                        <label style="justify-content: flex-start; gap: 10px; margin-top:5px;"><input type="checkbox" id="rbReverse"> 反转色彩流动方向</label>
                    </div>
                    <div id="customColorPanel" class="ctrl-row" style="display:none; gap:10px;">
                        <input type="color" id="cColor1" value="#00f2fe" style="flex:1;">
                        <input type="color" id="cColor2" value="#4facfe" style="flex:1;">
                    </div>
                    <hr style="border-top:1px solid var(--border); margin: 5px 0;">
                    <div class="ctrl-col">
                        <label style="color:#fcd34d;">全局辉光亮度 (Glow) <span class="val-display" id="valGlow">15</span> px</label>
                        <input type="range" id="glowStr" min="0" max="80" step="1" value="15">
                    </div>
                    <div class="ctrl-row">
                        <label style="justify-content: flex-start; gap: 10px;"><input type="checkbox" id="useCustomGlow"> 强制统一发光颜色</label>
                        <input type="color" id="glowColor" value="#ffffff" style="width:50px;">
                    </div>
                </div>
            </details>

            <details>
                <summary>🧭 物理坐标与平滑压限</summary>
                <div class="group-content">
                    <div class="ctrl-col">
                        <label>上部频谱 Y轴锚点偏移 <span class="val-display" id="valTopY">0</span></label>
                        <input type="range" id="topY" min="-400" max="400" step="5" value="0">
                    </div>
                    <div class="ctrl-col">
                        <label>下部频谱 Y轴锚点偏移 <span class="val-display" id="valBotY">0</span></label>
                        <input type="range" id="botY" min="-400" max="400" step="5" value="0">
                    </div>
                    <div class="ctrl-col">
                        <label>全局中心 X轴偏移 <span class="val-display" id="valGlobalX">0</span></label>
                        <input type="range" id="globalX" min="-800" max="800" step="10" value="0">
                    </div>
                    <hr style="border-top:1px solid var(--border);">
                    
                    <div class="ctrl-col">
                        <label>音频敏感度 (支持0.001极限微调) <span class="val-display" id="valSens">0.600</span></label>
                        <input type="range" id="sensitivity" min="0.001" max="2.000" step="0.001" value="0.600">
                    </div>
                    <div class="ctrl-col">
                        <label>高频柔和曲线压限系数 <span class="val-display" id="valSoftClip">0.60</span></label>
                        <input type="range" id="softClip" min="0.1" max="1.0" step="0.05" value="0.60">
                    </div>
                    <div class="ctrl-col">
                        <label>数据平滑度 (阻尼防抖) <span class="val-display" id="valSmooth">0.85</span></label>
                        <input type="range" id="smoothing" min="0.5" max="0.99" step="0.01" value="0.85">
                    </div>
                </div>
            </details>

            <details>
                <summary>✨ 环境粒子特效</summary>
                <div class="group-content">
                    <div class="ctrl-row">
                        <label>粒子预设材质</label>
                        <select id="particleType" style="width:60%;">
                            <option value="none">无 (关闭特效)</option>
                            <option value="snow">❄️ 飘雪 / 微尘</option>
                            <option value="petal">🌸 3D 落花</option>
                            <option value="spark">✨ 律动上升星火</option>
                        </select>
                    </div>
                    <div class="ctrl-row">
                        <label>全局粒子色调</label>
                        <input type="color" id="particleColor" value="#ffffff" style="width:60px;">
                    </div>
                    <div class="ctrl-col">
                        <label>物理尺寸倍率 <span class="val-display" id="valPSize">1.0</span></label>
                        <input type="range" id="pSize" min="0.5" max="5.0" step="0.1" value="1.0">
                    </div>
                    <div class="ctrl-col">
                        <label>重力/升力速度 <span class="val-display" id="valPSpeed">1.0</span></label>
                        <input type="range" id="pSpeed" min="0.1" max="8.0" step="0.1" value="1.0">
                    </div>
                </div>
            </details>
            
            <details open>
                <summary>🎥 录制与输出尺寸设定</summary>
                <div class="group-content">
                    <div class="ctrl-col">
                        <label>画布渲染与录制尺寸</label>
                        <select id="exportRes">
                            <option value="1920x1080" selected>1080P 超清 (标准级别)</option>
                            <option value="3840x2160">4K 极清 (高配重载级)</option>
                        </select>
                    </div>
                    <div class="ctrl-col">
                        <label>全景纵横显示比例 (Aspect Ratio)</label>
                        <select id="aspectRatio">
                            <option value="16/9" selected>16:9 (标准横屏短视频)</option>
                            <option value="9/16">9:16 (抖音/TikTok 竖屏)</option>
                            <option value="1/1">1:1 (正方形电商视觉)</option>
                            <option value="4/3">4:3 (复古传统画幅)</option>
                            <option value="21/9">21:9 (电影大宽幕)</option>
                        </select>
                    </div>
                    <div class="ctrl-col">
                        <label>视频格式容器</label>
                        <select id="exportFormat">
                            <option value="video/webm;codecs=vp9">WebM (VP9 高清/网页原生推荐)</option>
                            <option value="video/mp4;codecs=avc1">MP4 (H264 / 部分浏览器失效)</option>
                        </select>
                    </div>
                </div>
            </details>
        </div>

        <div class="record-zone">
            <button id="recordBtn" class="btn-record">🔴 录制并导出视频</button>
        </div>
    </div>

    <div class="main-view">
        <div id="canvasWrapper">
            <canvas id="visualizer" width="1920" height="1080"></canvas>
        </div>
        
        <div class="playback-controls">
            <button class="play-btn" id="playBtn">▶</button>
            <div class="progress-bar">
                <span id="timeCurrent">0:00</span>
                <input type="range" id="seekSlider" value="0" min="0" max="100" style="flex:1;">
                <span id="timeTotal">0:00</span>
            </div>
            <button class="play-btn" id="fullBtn" style="width:40px; height:40px; font-size:1.1rem; background:transparent; border:1px solid var(--border); color:var(--text-main);" title="全屏视听（全屏下支持空格控制播放）">⛶</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <video id="bgVideo" loop playsinline></video>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audioPlayer');
        const bgVideo = document.getElementById('bgVideo');
        const canvasWrapper = document.getElementById('canvasWrapper');

        let activeMedia = audioPlayer; 
        let bgImageObj = null; 
        let bgType = 'none'; 

        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => { document.body.classList.toggle('light'); });

        // 全屏逻辑
        document.getElementById('fullBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) canvasWrapper.requestFullscreen().catch(err => alert("全屏失败:" + err.message));
            else document.exitFullscreen();
        });

        // 全局键盘空格控制（自动解绑滑块聚焦）
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (document.activeElement) document.activeElement.blur(); // 消除对滑块的干扰
                togglePlayback();
            }
        });

        function togglePlayback() {
            initAudioEngine(); // 强震激流：在用户交互瞬间绑定并唤醒核心
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            if (activeMedia.paused) {
                activeMedia.play();
                if(bgType === 'video' && activeMedia !== bgVideo) bgVideo.play();
            } else {
                activeMedia.pause();
                if(bgType === 'video' && activeMedia !== bgVideo) bgVideo.pause();
            }
        }

        // 参数精准绑定
        function bind(id, valId, isFloat=false) {
            const el = document.getElementById(id);
            const disp = document.getElementById(valId);
            if(disp) el.addEventListener('input', () => {
                let v = parseFloat(el.value);
                disp.innerText = id === 'sensitivity' ? v.toFixed(3) : (isFloat ? (el.step.includes('0.01') ? v.toFixed(2) : v.toFixed(1)) : v);
            });
            return el;
        }
        
        const sBgDim = bind('bgDim', 'valBgDim', true);
        const sMinH = bind('minHeight', 'valMinH', true);
        const sBarCount = bind('barCount', 'valBarCount');
        const sBarThick = bind('barThick', 'valBarThick');
        const sBarGap = bind('barGap', 'valBarGap');
        const sSpecWidth = bind('spectrumWidth', 'valSpectrumWidth');
        const sSpecBounce = bind('spectrumBounce', 'valSpectrumBounce');
        
        const sTopY = bind('topY', 'valTopY');
        const sBotY = bind('botY', 'valBotY');
        const sGlobalX = bind('globalX', 'valGlobalX');
        const sSens = bind('sensitivity', 'valSens', true);
        const sSoftClip = bind('softClip', 'valSoftClip', true);
        const sSmooth = bind('smoothing', 'valSmooth', true);

        const sBarAlpha = bind('barAlpha', 'valBarAlpha', true);
        const sRbSpeed = bind('rbSpeed', 'valRbSpeed', true);
        const sGlowStr = bind('glowStr', 'valGlow');
        const sPSize = bind('pSize', 'valPSize', true);
        const sPSpeed = bind('pSpeed', 'valPSpeed', true);

        const showTop = document.getElementById('showTop');
        const showBot = document.getElementById('showBot');
        const layoutStyle = document.getElementById('layoutStyle');
        const barStyle = document.getElementById('barStyle');
        
        const colorMode = document.getElementById('colorMode');
        const cColor1 = document.getElementById('cColor1');
        const cColor2 = document.getElementById('cColor2');
        const rbReverse = document.getElementById('rbReverse');
        const useCustomGlow = document.getElementById('useCustomGlow');
        const glowColor = document.getElementById('glowColor');

        const pType = document.getElementById('particleType');
        const pColor = document.getElementById('particleColor');
        
        const exportRes = document.getElementById('exportRes');
        const aspectRatio = document.getElementById('aspectRatio');

        function updateCanvasDimensions() {
            const [baseW, baseH] = exportRes.value.split('x').map(Number);
            const [rW, rH] = aspectRatio.value.split('/').map(Number);
            const ratioFraction = rW / rH;

            if (ratioFraction >= 1) {
                canvas.height = baseH;
                canvas.width = Math.round(baseH * ratioFraction);
            } else {
                const shortSide = Math.min(baseW, baseH);
                canvas.width = shortSide;
                canvas.height = Math.round(shortSide / ratioFraction);
            }
            canvasWrapper.style.aspectRatio = aspectRatio.value;
        }
        exportRes.addEventListener('change', updateCanvasDimensions);
        aspectRatio.addEventListener('change', updateCanvasDimensions);

        colorMode.addEventListener('change', () => {
            document.getElementById('rainbowPanel').style.display = colorMode.value === 'rainbow' ? 'flex' : 'none';
            document.getElementById('customColorPanel').style.display = colorMode.value === 'rainbow' ? 'none' : 'flex';
            cColor2.style.display = colorMode.value === 'single' ? 'none' : 'block';
        });

        // 媒体控制层
        const audioFile = document.getElementById('audioFile');
        const bgFile = document.getElementById('bgFile');
        let audioCtx = null, analyser = null, audioSourceNode = null, bgSourceNode = null;
        let isRecording = false, mediaRecorder, chunks = [];

        function toggleClearBtn(input, btnId, labelId, defaultText) {
            document.getElementById(btnId).style.display = input.files.length ? 'block' : 'none';
            if(!input.files.length) document.getElementById(labelId).innerText = defaultText;
        }

        audioFile.addEventListener('change', (e) => {
            if(e.target.files[0]) {
                audioPlayer.src = URL.createObjectURL(e.target.files[0]);
                document.getElementById('audioLabel').innerText = e.target.files[0].name;
                activeMedia = audioPlayer; 
                bgVideo.muted = true; // 有独立音频，则背景视频强制静音
                initAudioEngine();
            }
            toggleClearBtn(audioFile, 'clearAudio', 'audioLabel', "📥 载入音频 (MP3/WAV)");
        });
        document.getElementById('clearAudio').addEventListener('click', () => {
            audioFile.value = ''; audioPlayer.src = ''; toggleClearBtn(audioFile, 'clearAudio', 'audioLabel', "📥 载入音频 (MP3/WAV)");
            if (bgType === 'video') { activeMedia = bgVideo; bgVideo.muted = false; }
        });

        bgFile.addEventListener('change', (e) => {
            let f = e.target.files[0];
            if(f) {
                let url = URL.createObjectURL(f);
                if(f.type.startsWith('video')) {
                    bgType = 'video'; 
                    bgVideo.src = url;
                    bgVideo.load();
                    
                    // 单视频内核无缝联动：没纯音频时由背景视频单体接管全局
                    if(!audioFile.files.length) {
                        activeMedia = bgVideo;
                        bgVideo.muted = false; 
                        document.getElementById('audioLabel').innerText = "🔊 已自动同步视频原声";
                        initAudioEngine();
                    } else {
                        bgVideo.muted = true;
                    }
                    if(!activeMedia.paused) bgVideo.play().catch(err=>console.log(err));
                } else {
                    bgType = 'image'; bgImageObj = new Image(); bgImageObj.src = url;
                }
                document.getElementById('bgLabel').innerText = f.name;
            }
            toggleClearBtn(bgFile, 'clearBg', 'bgLabel', "🖼️ 载入视觉背景 (图/视频)");
        });
        document.getElementById('clearBg').addEventListener('click', () => {
            bgFile.value = ''; bgVideo.removeAttribute('src'); bgVideo.load(); bgImageObj = null; bgType = 'none'; 
            toggleClearBtn(bgFile, 'clearBg', 'bgLabel', "🖼️ 载入视觉背景 (图/视频)");
            if(activeMedia === bgVideo) { activeMedia = audioPlayer; audioPlayer.src = ''; }
        });

        // 时间轴刷新联动
        function updateTimeline() {
            if(activeMedia && activeMedia.duration) {
                document.getElementById('seekSlider').value = (activeMedia.currentTime / activeMedia.duration) * 100;
                let m1 = Math.floor(activeMedia.currentTime/60), s1 = Math.floor(activeMedia.currentTime%60);
                let m2 = Math.floor(activeMedia.duration/60), s2 = Math.floor(activeMedia.duration%60);
                document.getElementById('timeCurrent').innerText = `${m1}:${s1<10?'0'+s1:s1}`;
                document.getElementById('timeTotal').innerText = `${m2}:${s2<10?'0'+s2:s2}`;
            }
            document.getElementById('playBtn').innerText = activeMedia.paused ? "▶" : "⏸";
            requestAnimationFrame(updateTimeline);
        }
        requestAnimationFrame(updateTimeline);

        document.getElementById('seekSlider').addEventListener('input', (e) => {
            if(activeMedia && activeMedia.duration) {
                activeMedia.currentTime = (e.target.value / 100) * activeMedia.duration;
                if(bgType === 'video' && activeMedia === audioPlayer) bgVideo.currentTime = audioPlayer.currentTime;
            }
        });
        document.getElementById('playBtn').addEventListener('click', togglePlayback);

        // 【终极解决】：静态常驻硬件单向级联连接
        function initAudioEngine() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                
                // 将两个常驻DOM的多媒体标签锁死绑定在核心图谱上
                audioSourceNode = audioCtx.createMediaElementSource(audioPlayer);
                audioSourceNode.connect(analyser);
                
                bgSourceNode = audioCtx.createMediaElementSource(bgVideo);
                bgSourceNode.connect(analyser);
                
                analyser.connect(audioCtx.destination);
                
                // 启动不间断自守渲染环
                requestAnimationFrame(draw);
            }
        }

        function hexToRgb(hex) {
            let r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return r ? {r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16)} : {r:0,g:0,b:0};
        }
        function getComputedColor(index, total) {
            if (colorMode.value === 'rainbow') {
                return `hsl(${((hue + (rbReverse.checked ? -1 : 1) * index * (360/total)) % 360 + 360) % 360}, 100%, 60%)`;
            } else if (colorMode.value === 'single') {
                return cColor1.value;
            } else {
                let c1 = hexToRgb(cColor1.value), c2 = hexToRgb(cColor2.value), f = index / total;
                return `rgb(${Math.round(c1.r + f*(c2.r-c1.r))}, ${Math.round(c1.g + f*(c2.g-c1.g))}, ${Math.round(c1.b + f*(c2.b-c1.b))})`;
            }
        }

        let particles = [];
        function getParticle() {
            return {
                x: Math.random() * canvas.width, y: pType.value === 'spark' ? canvas.height + 10 : -10,
                s: Math.random() * 3 * parseFloat(sPSize.value) + 1,
                vx: (Math.random() - 0.5) * 2,
                vy: pType.value === 'spark' ? -(Math.random() * 3 + 1) : (Math.random() * 3 + 1),
                a: Math.random() * 360, va: (Math.random() - 0.5) * 0.1
            };
        }

        const dataArray = new Uint8Array(512);
        let hue = 0;

        function draw() {
            if(analyser) {
                analyser.smoothingTimeConstant = parseFloat(sSmooth.value);
                analyser.getByteFrequencyData(dataArray);
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.shadowBlur = 0; // 极速清空状态，打破4K算力无底洞
            ctx.globalAlpha = 1.0;
            
            // 覆盖式智能居中剪裁 (Cover 机制，绝不拉伸变形)
            if (bgType === 'video' && bgVideo.videoWidth) {
                let scale = Math.max(canvas.width / bgVideo.videoWidth, canvas.height / bgVideo.videoHeight);
                let dw = bgVideo.videoWidth * scale; let dh = bgVideo.videoHeight * scale;
                ctx.drawImage(bgVideo, (canvas.width - dw)/2, (canvas.height - dh)/2, dw, dh);
            } else if (bgType === 'image' && bgImageObj) {
                let scale = Math.max(canvas.width / bgImageObj.width, canvas.height / bgImageObj.height);
                let dw = bgImageObj.width * scale; let dh = bgImageObj.height * scale;
                ctx.drawImage(bgImageObj, (canvas.width - dw)/2, (canvas.height - dh)/2, dw, dh);
            }
            
            ctx.fillStyle = `rgba(5, 5, 8, ${sBgDim.value})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let bass = 0; for(let i=0; i<6; i++) bass += dataArray[i]; bass /= 6;
            let bassRatio = bass / 255; 
            
            // 粒子模拟
            if (pType.value !== 'none') {
                if(particles.length < 120) particles.push(getParticle());
                const hC = hexToRgb(pColor.value);
                particles.forEach((p, i) => {
                    let sm = parseFloat(sPSpeed.value);
                    if(pType.value === 'snow') {
                        p.y += p.vy * sm; p.x += Math.sin(p.y/60) + p.vx;
                        ctx.fillStyle = `rgba(${hC.r},${hC.g},${hC.b},0.6)`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                    } else if(pType.value === 'petal') {
                        p.y += p.vy * sm; p.x += p.vx * 2; p.a += p.va;
                        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
                        ctx.fillStyle = `rgba(${hC.r},${hC.g},${hC.b},0.8)`;
                        ctx.beginPath(); ctx.ellipse(0, 0, p.s*2, p.s, 0, 0, Math.PI*2); ctx.fill();
                        ctx.restore();
                    } else if(pType.value === 'spark') {
                        p.y += p.vy * sm * (1 + bassRatio); p.x += p.vx;
                        ctx.fillStyle = `rgba(${hC.r},${hC.g},${hC.b}, ${1 - (canvas.height - p.y)/canvas.height})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
                    }
                    if(p.y > canvas.height + 50 || p.y < -50 || p.x < -50 || p.x > canvas.width+50) particles[i] = getParticle();
                });
            }

            // 精密解耦全宽呼吸碰撞公式
            const baseWidthPercent = parseFloat(sSpecWidth.value) / 100;
            const bouncePercent = parseFloat(sSpecBounce.value) / 100;
            const baseW_pixels = canvas.width * baseWidthPercent;
            const bouncePixels = canvas.width * bouncePercent * bassRatio;
            
            let currentTotalWidth = baseW_pixels + bouncePixels;
            currentTotalWidth = Math.min(canvas.width, currentTotalWidth); 
            
            const activeLen = parseInt(sBarCount.value); 
            const isSym = layoutStyle.value === 'symmetric';
            const totalBars = isSym ? (activeLen * 2) : activeLen;
            const gap = parseInt(sBarGap.value);       
            const unitThick = parseInt(sBarThick.value); 

            const stepX = currentTotalWidth / totalBars;
            const startX = isSym ? canvas.width / 2 + parseInt(sGlobalX.value) : (canvas.width - currentTotalWidth) / 2 + parseInt(sGlobalX.value);

            ctx.lineCap = barStyle.value; 
            ctx.lineWidth = unitThick;
            ctx.globalAlpha = parseFloat(sBarAlpha.value);
            
            // 4K自适应降低辉光半径限制
            let glow = parseInt(sGlowStr.value);
            if(canvas.width > 2000) glow = Math.min(glow, 22); 
            if(glow > 0) ctx.shadowBlur = glow;
            
            if(activeMedia && !activeMedia.paused) hue += parseFloat(sRbSpeed.value);
            
            const minH = parseFloat(sMinH.value);
            const sens = parseFloat(sSens.value);
            const clip = parseFloat(sSoftClip.value) * 600;
            const tY = parseInt(sTopY.value);
            const bY = parseInt(sBotY.value);

            function drawVerticalLine(x, finalH) {
                if(showBot.checked) {
                    ctx.beginPath(); ctx.moveTo(x, canvas.height - bY); ctx.lineTo(x, canvas.height - bY - finalH); ctx.stroke();
                }
                if(showTop.checked) {
                    ctx.beginPath(); ctx.moveTo(x, tY); ctx.lineTo(x, tY + finalH); ctx.stroke();
                }
            }

            for (let i = 0; i < activeLen; i++) {
                let rawVal = (dataArray[i] / 255) * canvas.height * sens;
                let finalH = rawVal;
                if(finalH > clip) finalH = clip + (canvas.height*0.4 - clip) * (1 - Math.exp(-(finalH - clip) / 200));
                finalH = Math.max(minH, finalH); 

                const col = getComputedColor(i, activeLen);
                ctx.strokeStyle = col;
                if(glow > 0) ctx.shadowColor = useCustomGlow.checked ? glowColor.value : col;

                if (isSym) {
                    let xLeft = startX - (i * stepX);
                    drawVerticalLine(xLeft, finalH);
                    let xRight = startX + (i * stepX);
                    if(i !== 0) drawVerticalLine(xRight, finalH); 
                } else {
                    let x = startX + (i * stepX);
                    drawVerticalLine(x, finalH);
                }
            }

            requestAnimationFrame(draw);
        }

        // 高清录制
        recordBtn.addEventListener('click', () => {
            if(!audioCtx) return alert("请载入音频或视频并播放后再录制！");
            if(!isRecording) {
                isRecording = true; chunks = [];
                const stream = canvas.captureStream(60);
                const dest = audioCtx.createMediaStreamDestination();
                analyser.connect(dest);
                const combined = new MediaStream([stream.getVideoTracks()[0], dest.stream.getAudioTracks()[0]]);
                
                let opts = { mimeType: document.getElementById('exportFormat').value, videoBitsPerSecond: 18000000 };
                if(!MediaRecorder.isTypeSupported(opts.mimeType)) opts = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 18000000 };

                mediaRecorder = new MediaRecorder(combined, opts);
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); 
                    a.download = `Visualizer_Pro_v1_${Date.now()}.webm`; a.click();
                    recordBtn.innerText = "处理完毕，触发下载"; recordBtn.classList.remove('btn-recording');
                    analyser.disconnect(dest);
                };
                mediaRecorder.start();
                recordBtn.innerText = "Stop Recording"; recordBtn.classList.add('btn-recording');
                if(activeMedia.paused) togglePlayback();
            } else {
                isRecording = false; mediaRecorder.stop();
            }
        });

        // 首次加载初始化自洗牌
        updateCanvasDimensions();
    </script>
</body>
</html>
